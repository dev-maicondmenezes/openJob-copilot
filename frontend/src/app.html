<!doctype html>
<html lang="pt-BR" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Anti-FOUC: aplica tema e idioma ANTES do CSS/JS da aplicação (CP13 §3). -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('openjob.theme') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' &&
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
				try {
					var locale = localStorage.getItem('openjob.locale');
					if (!locale) {
						var langs =
							navigator.languages && navigator.languages.length
								? navigator.languages
								: [navigator.language || 'en-US'];
						var tag = String(langs[0] || 'en-US').toLowerCase().replace('_', '-');
						locale =
							tag === 'pt' || tag.indexOf('pt-') === 0
								? 'pt-BR'
								: tag === 'es' || tag.indexOf('es-') === 0
									? 'es-419'
									: 'en-US';
					}
					if (['pt-BR', 'en-US', 'es-419'].indexOf(locale) === -1) locale = 'en-US';
					document.documentElement.lang = locale;
				} catch (e) {
					document.documentElement.lang = 'en-US';
				}
			})();
		</script>
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f172a" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c" />
		<!-- O fallback do adapter-static não passa pelo transformIndexHtml do
		     Vite, então o link do manifest é declarado aqui (PWA instalável). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="openJob" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
