name: frontend (design system CP12 + dark mode/i18n CP13)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml as a publishing gate (CP11)

permissions:
  contents: read

jobs:
  ui:
    # Pinado: os snapshots visuais pressupõem fontes e renderização desta imagem.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Fontes dos snapshots visuais: Noto Sans resolve system-ui e DejaVu Sans
      # Mono resolve ui-monospace. Sem elas o Chromium do runner usa outros
      # glifos e todos os baselines falham.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-dejavu-core
      - run: npm ci
      - run: npm run check
      # CP13: falha se faltar chave em pt-BR/es-419 ou placeholders divergirem.
      - run: npm run i18n:check
      # PR falha se usar cor/spacing/raio fora dos tokens em src/routes/.
      - run: npm run lint:ui
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run audit:a11y
      - run: npm run test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
