# openJob — local run with the official image published on Docker Hub (CP11).
#
#   docker compose up -d
#
# The database and the master key live in the named volume `openjob-data`
# (/data). Back the volume up as one unit; never commit or share the key.
# To build from source instead, add the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  openjob:
    # Official image (docs/distribution.md). Pin a version for reproducible
    # installs, e.g. OPENJOB_IMAGE=maicondmenezes/openjob:1.2.3
    image: ${OPENJOB_IMAGE:-maicondmenezes/openjob:latest}
    container_name: openjob
    ports:
      - "8080:8080"
    environment:
      OPENJOB_PORT: "8080"
      OPENJOB_DB_PATH: /data/openjob.db
      OPENJOB_HOSTNAME: ${OPENJOB_HOSTNAME:-openjob.copilot}
      # Release flags default to on in the MVP; set to "false" for rollback.
      # See the README for the full list of OPENJOB_FEATURE_* variables.
      # OPENJOB_FEATURE_UI_FEED: "false"
    volumes:
      - openjob-data:/data
    restart: unless-stopped

  # Sidecar: announces openjob.copilot on the LAN via mDNS.
  # Use on Mac/Windows guests (no native avahi). On Linux guests the PREFERRED
  # path is the native avahi alias (see scripts/setup-dns.sh avahi and
  # docs/adr/0001) — keep only ONE mDNS responder per network.
  # Android/Chrome cannot resolve .local (Chromium limitation): use
  # http://<vm-ip>.nip.io:8080 there.
  # Set OPENJOB_LAN_IP in a .env file to your notebook's LAN IP:
  #   echo "OPENJOB_LAN_IP=192.168.1.10" > .env
  mdns:
    image: skhmt/mdns:latest
    container_name: openjob-mdns
    network_mode: host
    environment:
      HOST: ${OPENJOB_HOSTNAME:-openjob.copilot}
      IP: ${OPENJOB_LAN_IP:-}
    restart: unless-stopped

volumes:
  openjob-data:
