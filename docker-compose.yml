services:
  openjob:
    build: .
    image: openjob:local
    container_name: openjob
    user: "${OPENJOB_UID:-1000}:${OPENJOB_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      OPENJOB_PORT: "8080"
      OPENJOB_DB_PATH: /data/openjob.db
      OPENJOB_HOSTNAME: openjob.copilot
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Sidecar: announces openjob.copilot on the LAN via mDNS.
  # Use on Mac/Windows guests (no native avahi). On Linux guests the PREFERRED
  # path is the native avahi alias (see scripts/setup-dns.sh avahi and
  # docs/adr/0001) — keep only ONE mDNS responder per network.
  # Android/Chrome cannot resolve .local (Chromium limitation): use
  # http://<vm-ip>.nip.io:8080 there.
  # Set OPENJOB_LAN_IP in a .env file to your notebook's LAN IP:
  #   echo "OPENJOB_LAN_IP=192.168.1.10" > .env
  mdns:
    image: skhmt/mdns:latest
    container_name: openjob-mdns
    network_mode: host
    environment:
      HOST: ${OPENJOB_HOSTNAME:-openjob.copilot}
      IP: ${OPENJOB_LAN_IP:-}
    restart: unless-stopped
