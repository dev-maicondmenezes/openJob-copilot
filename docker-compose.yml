services:
  openjob:
    build: .
    image: openjob:local
    container_name: openjob
    ports:
      - "8080:8080"
    environment:
      OPENJOB_PORT: "8080"
      OPENJOB_DB_PATH: /data/openjob.db
      OPENJOB_HOSTNAME: openjob.local
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Sidecar: announces openjob.local on the LAN via mDNS.
  # Works natively on Linux; on macOS/Windows the host's Bonjour usually
  # resolves .local already — see README "Local DNS" section.
  # Set OPENJOB_LAN_IP in a .env file to your notebook's LAN IP:
  #   echo "OPENJOB_LAN_IP=192.168.1.10" > .env
  mdns:
    image: skhmt/mdns:latest
    container_name: openjob-mdns
    network_mode: host
    environment:
      HOST: ${OPENJOB_HOSTNAME:-openjob.local}
      IP: ${OPENJOB_LAN_IP:-}
    restart: unless-stopped
